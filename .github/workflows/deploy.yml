name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Create .env file from secrets
        run: |
          echo "PHONE=${{ secrets.PHONE }}" > .env
          echo "ADDRESS=\"${{ secrets.ADDRESS }}\"" >> .env

      - name: Build HTML with environment variables
        run: npm run build:env

      - name: Copy dist files to main files
        run: |
          cp index-dist.html index.html
          cp index-light-dist.html index-light.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
